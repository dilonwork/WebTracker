<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect width="760" height="480" fill="#f7f8fa"/>
  <text x="20" y="32" font-size="18" font-weight="bold" fill="#222">WebTracker 系統架構</text>

  <!-- Browser -->
  <rect x="20" y="60" width="150" height="70" rx="8" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="95" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">瀏覽器</text>
  <text x="95" y="110" text-anchor="middle" font-size="12" fill="#555">React 18 + Vite 前端</text>

  <!-- Frontend note -->
  <text x="95" y="150" text-anchor="middle" font-size="11" fill="#777">開發時 /api 代理到後端</text>

  <!-- Backend -->
  <rect x="305" y="60" width="170" height="70" rx="8" fill="#e6f4ea" stroke="#34a853"/>
  <text x="390" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Express 後端</text>
  <text x="390" y="110" text-anchor="middle" font-size="12" fill="#555">REST API（:BACKEND_PORT）</text>

  <!-- node-cron -->
  <rect x="305" y="200" width="170" height="70" rx="8" fill="#fef7e0" stroke="#fbbc04"/>
  <text x="390" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">node-cron 排程</text>
  <text x="390" y="250" text-anchor="middle" font-size="12" fill="#555">定時爬取・整點更新股價</text>

  <!-- Postgres -->
  <rect x="610" y="60" width="130" height="70" rx="8" fill="#eaf1fb" stroke="#3367d6"/>
  <text x="675" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">PostgreSQL</text>
  <text x="675" y="110" text-anchor="middle" font-size="11" fill="#555">pages / results</text>
  <text x="675" y="126" text-anchor="middle" font-size="11" fill="#555">fin_accounts / fin_cash_demands</text>

  <!-- Ollama -->
  <rect x="610" y="200" width="130" height="70" rx="8" fill="#f3e8fd" stroke="#9334e6"/>
  <text x="675" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Ollama</text>
  <text x="675" y="250" text-anchor="middle" font-size="11" fill="#555">自架 LLM・AI 分析與診斷</text>

  <!-- Target websites -->
  <rect x="20" y="200" width="150" height="70" rx="8" fill="#fce8e6" stroke="#ea4335"/>
  <text x="95" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">目標網站</text>
  <text x="95" y="250" text-anchor="middle" font-size="12" fill="#555">cheerio 解析 HTML</text>

  <!-- Yahoo -->
  <rect x="20" y="330" width="150" height="70" rx="8" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="95" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Yahoo Finance</text>
  <text x="95" y="380" text-anchor="middle" font-size="12" fill="#555">每小時抓股票現價</text>

  <!-- Tabs note -->
  <rect x="305" y="330" width="435" height="110" rx="8" fill="#ffffff" stroke="#dadce0"/>
  <text x="325" y="356" font-size="13" font-weight="bold" fill="#222">前端四個分頁</text>
  <text x="325" y="380" font-size="12" fill="#555">📊 儀表板 — 淨資產 Hero 卡、走勢圖、帳戶清單、AI 診斷</text>
  <text x="325" y="400" font-size="12" fill="#555">📝 水位維護 — 帳戶水位手動更新・📈 股票帳戶 — 成本手動、現價自動</text>
  <text x="325" y="420" font-size="12" fill="#555">🧾 近期待繳 — 現金需求管理・🕷️ 網站監控 — 追蹤任務與 AI 分析結果</text>

  <!-- Arrows -->
  <line x1="170" y1="95" x2="300" y2="95" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="95" x2="605" y2="95" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="130" x2="390" y2="195" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="305" y1="235" x2="175" y2="235" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="226" text-anchor="middle" font-size="11" fill="#555">爬取</text>
  <line x1="475" y1="235" x2="605" y2="235" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="226" text-anchor="middle" font-size="11" fill="#555">AI 分析</text>
  <line x1="170" y1="365" x2="300" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225" y="322" text-anchor="middle" font-size="11" fill="#555">現價</text>
</svg>
